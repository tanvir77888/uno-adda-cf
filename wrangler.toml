name = "uno-adda"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Static client (public/index.html, style.css, app.js). Paths that match a
# file are served straight from assets; everything else reaches the Worker,
# which handles /health and the /ws* WebSocket routes itself.
[assets]
directory = "./public"
binding = "ASSETS"

# One GameRoom Durable Object per room code.
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# Singleton leaderboard (cumulative bot/quick-match stats).
[[durable_objects.bindings]]
name = "BOARD"
class_name = "LeaderboardDO"

# Singleton player accounts (phone + password auth, wallet, stats).
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountsDO"

# Singleton live-matchmaking queues (Quick tiers + Go Wild).
[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "MatchmakerDO"

# SQLite-backed Durable Objects — the class type available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# v3: adds the leaderboard class only; existing GameRoom storage is untouched.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["LeaderboardDO"]

# accounts: adds the accounts class only; GameRoom + LeaderboardDO storage untouched.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["AccountsDO"]

# matchmaker: adds the matchmaking class only; existing storage untouched.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["MatchmakerDO"]

[vars]
# Web Push (VAPID): the public key is safe to ship; the matching private
# key is a Worker SECRET (wrangler secret put VAPID_PRIVATE_KEY) and is
# never committed.
VAPID_PUBLIC_KEY = "BL7aG9o6c-Fe38Ic5bqhxiN7okOBzElUMigiUxo3LUPXvOP1CTde_ph3E52VQyyyUZ7a3duj9jt6yMUgPN_nuLI"
# Bootstrap admin: the account with this phone becomes admin at signup
# and is re-asserted at every login. EMPTY = no bootstrap admin.
# Fill this in at deploy time (parent handles it).
ADMIN_PHONE = "01761427351"
